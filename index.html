<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Instagramw</title>
  <!-- Tailwind CSS para diseño profesional -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Iconos modernos -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Transiciones suaves para las pantallas */
    .screen {
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
    }
    .screen-hidden {
      display: none !important;
      opacity: 0;
      transform: scale(0.95);
    }
    /* Estilos para ocultar scrollbar manteniendo funcionalidad */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-black text-zinc-100 font-sans min-h-screen overflow-hidden select-none">

  <!-- CONTENEDOR PRINCIPAL (Usa Dynamic Viewport Height para adaptarse perfectamente a celulares) -->
  <div class="relative w-full h-[100dvh] flex flex-col justify-between overflow-hidden">
    
    <!-- ========================================== -->
    <!-- PANTALLA 1: SPLASH SCREEN (Carga Inicial) -->
    <!-- ========================================== -->
    <div id="screen-splash" class="screen flex-1 flex flex-col justify-center items-center p-6 bg-gradient-to-b from-zinc-900 to-black z-40">
      <div class="flex flex-col items-center gap-4">
        <!-- Contenedor del Logo de Carga (Carga tu icono.png) -->
        <div class="w-24 h-24 flex items-center justify-center animate-pulse">
          <img src="icono.png" alt="Logo" class="w-full h-full object-contain">
        </div>
        <h1 class="text-2xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white to-zinc-400 mt-2">
          INSTAGRAM
        </h1>
        <p class="text-xs text-zinc-500 tracking-wider">MEDIA TECH</p>
      </div>
      
      <!-- Indicador de carga inferior -->
      <div class="absolute bottom-16 flex flex-col items-center gap-2">
        <div class="w-6 h-6 border-2 border-t-indigo-500 border-zinc-700 rounded-full animate-spin"></div>
        <span class="text-[10px] text-zinc-600 tracking-widest uppercase">Cargando</span>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- PANTALLA 2: LOGIN (Inicio de Sesión) -->
    <!-- ========================================== -->
    <div id="screen-login" class="screen screen-hidden flex-1 flex flex-col justify-center px-8 py-6 z-30 overflow-y-auto no-scrollbar">
      <div class="w-full max-w-sm mx-auto space-y-6">
        <div>
          <h2 class="text-3xl font-extrabold text-white mb-2">Bienvenido</h2>
          <p class="text-sm text-zinc-400">Inicia sesión</p>
        </div>

        <!-- Formulario -->
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Usuario</label>
            <input type="text" id="input-username" placeholder="usuario" class="w-full bg-zinc-800/50 border border-zinc-700/60 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Contraseña</label>
            <input type="password" id="input-password" placeholder="••••••••" class="w-full bg-zinc-800/50 border border-zinc-700/60 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
          </div>

          <!-- Mensaje de error interno (para no usar alert) -->
          <p id="login-error" class="text-xs text-red-400 hidden flex items-center gap-1.5">
            <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> Credenciales incorrectas. Intenta de nuevo.
          </p>

          <button onclick="handleLogin()" class="w-full bg-white text-black font-semibold rounded-xl py-3.5 text-sm hover:bg-zinc-200 active:scale-95 transition-all duration-200 mt-2">
            Entrar
          </button>
        </div>

        <div class="pt-4 text-center">
          <span class="text-xs text-zinc-500"> <b class="text-zinc-400"></b> <b class="text-zinc-400"></b></span>
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- PANTALLA 3: LOADING TRANSICIONAL -->
    <!-- ========================================== -->
    <div id="screen-loading-transition" class="screen screen-hidden flex-1 flex flex-col justify-center items-center bg-black z-40">
      <div class="flex flex-col items-center gap-3">
        <div class="w-8 h-8 border-3 border-t-white border-zinc-800 rounded-full animate-spin"></div>
        <span class="text-xs text-zinc-400 tracking-wider">Iniciando sesión...</span>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- PANTALLA 4: PERFIL SOCIAL (App Principal) -->
    <!-- ========================================== -->
    <div id="screen-profile" class="screen screen-hidden flex-1 flex flex-col justify-between h-full bg-black relative">
      
      <!-- Contenido Escroleable de Perfil (pb-24 para que no lo tape la barra de navegación) -->
      <div class="flex-1 overflow-y-auto no-scrollbar pb-24">
        
        <!-- Header de Perfil -->
        <div class="flex justify-between items-center px-6 py-4 border-b border-zinc-900 mt-2">
          <div class="flex items-center gap-1">
            <span class="font-bold text-base">ecsarvall</span>
          </div>
          <div class="flex gap-4">
            <button onclick="openCustomModal('Crear Publicación', 'Contacta a soporte para desbloquear')">
              <i data-lucide="plus-square" class="w-6 h-6 text-zinc-300"></i>
            </button>
            <button onclick="openCustomModal('Opciones de Cuenta', 'Contacta a soporte para desbloquear')">
              <i data-lucide="menu" class="w-6 h-6 text-zinc-300"></i>
            </button>
          </div>
        </div>

        <!-- Info Principal (Foto y Stats) -->
        <div class="px-6 py-5 flex items-center justify-between gap-4">
          <!-- Avatar de Perfil Principal -->
          <div class="relative group cursor-pointer flex-shrink-0" onclick="openCustomModal('Foto de Perfil', 'Contacta a soporte para desbloquear')">
            <div class="w-20 h-20 rounded-full bg-gradient-to-tr  p-[3px]">
              <!-- Imagen local perfil.png -->
              <img src="perfil.png" alt="Avatar" class="w-full h-full rounded-full object-cover border-2 border-black">
            </div>
            <span class="absolute bottom-0 right-0 bg-indigo-500 text-white rounded-full p-1 border-2 border-black">
              <i data-lucide="plus" class="w-3 h-3"></i>
            </span>
          </div>

          <!-- Stats Interactivos -->
          <div class="flex flex-1 justify-around text-center">
            <div class="cursor-pointer" onclick="openCustomModal('Publicaciones', 'El acceso a la lista detallada de publicaciones está restringido. Contacta a soporte.')">
              <div class="text-base font-bold text-white">11</div>
              <div class="text-[9px] uppercase text-zinc-500 tracking-wider">Posts</div>
            </div>
            <div class="cursor-pointer" onclick="openCustomModal('Seguidores', 'Contacta a soporte para desbloquear')">
              <div class="text-base font-bold text-white">55</div>
              <div class="text-[9px] uppercase text-zinc-500 tracking-wider">Seguidores</div>
            </div>
            <div class="cursor-pointer" onclick="openCustomModal('Seguidos', 'Contacta a soporte para desbloquear')">
              <div class="text-base font-bold text-white">78</div>
              <div class="text-[9px] uppercase text-zinc-500 tracking-wider">Seguidos</div>
            </div>
          </div>
        </div>

        <!-- Nombre y Bio -->
        <div class="px-6 mb-4">
          <h3 class="font-semibold text-sm text-white">Ecsar Vall</h3>
          <p class="text-xs text-zinc-400 mt-1 leading-relaxed">
            
          </p>
        </div>

        <!-- Botones de Acción de Perfil -->
        <div class="px-6 flex gap-2 mb-6">
          <button onclick="openCustomModal('Editar Perfil', 'Contacta a soporte para desbloquear')" class="flex-1 bg-zinc-800 text-white text-xs font-semibold rounded-lg py-2.5 active:bg-zinc-700 transition">
            Editar perfil
          </button>
          <button onclick="openCustomModal('Compartir Perfil', 'Contacta a soporte para desbloquear')" class="flex-1 bg-zinc-800 text-white text-xs font-semibold rounded-lg py-2.5 active:bg-zinc-700 transition">
            Compartir perfil
          </button>
        </div>

        <!-- Pestañas (Solo iconos) -->
        <div class="flex border-b border-zinc-900 text-zinc-500">
          <div class="flex-1 py-3 text-center border-b-2 border-white text-white">
            <i data-lucide="grid" class="w-5 h-5 mx-auto"></i>
          </div>
          <div class="flex-1 py-3 text-center">
            <i data-lucide="clapperboard" class="w-5 h-5 mx-auto"></i>
          </div>
          <div class="flex-1 py-3 text-center">
            <i data-lucide="user-square-2" class="w-5 h-5 mx-auto"></i>
          </div>
        </div>

        <!-- SECCIÓN "TOCAR PARA DESBLOQUEAR" -->
        <div class="p-6 mt-6">
          <button 
            onclick="openCustomModal('Contenido Bloqueado', 'Para desbloquear y visualizar el feed de publicaciones de este perfil, es necesario contactar al soporte técnico para verificar tus credenciales de acceso.')"
            class="w-full aspect-[3/2] bg-zinc-900 border-2 border-dashed border-zinc-700 rounded-2xl flex flex-col items-center justify-center gap-4 group hover:border-indigo-500/50 hover:bg-zinc-800/50 transition-all duration-300 active:scale-[0.98]"
          >
            <div class="p-4 rounded-full bg-zinc-800 group-hover:bg-indigo-950/50 transition-colors">
              <i data-lucide="lock" class="w-8 h-8 text-zinc-500 group-hover:text-indigo-400 transition-colors"></i>
            </div>
            <div class="text-center">
              <span class="block text-sm font-semibold text-zinc-300 group-hover:text-white">Tocar para desbloquear</span>
              <span class="block text-xs text-zinc-600 mt-1 group-hover:text-zinc-400">Contenido protegido</span>
            </div>
          </button>
        </div>

      </div>

      <!-- Barra de Navegación Inferior (Fijada abajo de forma segura con pb-safe) -->
      <div class="absolute bottom-0 left-0 right-0 bg-black/95 border-t border-zinc-900 px-6 py-4 flex justify-between items-center text-zinc-400 z-30 pb-[calc(1rem+env(safe-area-inset-bottom))]">
        <button onclick="openCustomModal('Inicio', 'Contacta a soporte para desbloquear')">
          <i data-lucide="home" class="w-6 h-6 hover:text-white transition"></i>
        </button>
        <button onclick="openCustomModal('Buscar', 'Contacta a soporte para desbloquear')">
          <i data-lucide="search" class="w-6 h-6 hover:text-white transition"></i>
        </button>
        <button onclick="openCustomModal('Notificaciones', 'Contacta a soporte para desbloquear')">
          <i data-lucide="heart" class="w-6 h-6 hover:text-white transition"></i>
        </button>
        <button onclick="openCustomModal('Mensajes Privados', 'Contacta a soporte para desbloquear')" class="relative">
          <i data-lucide="mail" class="w-6 h-6 hover:text-white transition"></i>
          <span class="absolute -top-1.5 -right-1.5 bg-red-500 w-4 h-4 rounded-full text-[9px] text-white flex items-center justify-center font-bold">1</span>
        </button>
        <!-- Versión Mini de perfil.png en la barra de navegación -->
        <button class="w-6 h-6 rounded-full border border-white overflow-hidden flex-shrink-0">
          <img src="perfil.png" class="w-full h-full object-cover" alt="mini avatar">
        </button>
      </div>

    </div>

    <!-- ========================================== -->
    <!-- MODAL INTEGRADO -->
    <!-- ========================================== -->
    <div id="custom-modal" class="absolute inset-0 bg-black/85 backdrop-blur-sm z-50 flex justify-center items-end hidden opacity-0 transition-opacity duration-300">
      <div id="modal-card" class="w-full bg-zinc-900 border-t border-zinc-800 rounded-t-[30px] p-6 space-y-5 transform translate-y-full transition-transform duration-300 pb-[calc(2rem+env(safe-area-inset-bottom))]">
        <div class="w-12 h-1 bg-zinc-700 rounded-full mx-auto"></div>
        
        <div class="space-y-2">
          <h4 id="modal-title" class="text-lg font-bold text-white flex items-center gap-2">
            <i data-lucide="info" class="w-5 h-5 text-indigo-400"></i>
            Título
          </h4>
          <p id="modal-text" class="text-sm text-zinc-400 leading-relaxed">
            Texto de explicación interactivo...
          </p>
        </div>

        <div class="flex flex-col gap-2.5 pt-2">
          <a id="btn-whatsapp" href="https://m.me/61591182700253" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl py-3.5 text-sm text-center flex items-center justify-center gap-2 active:scale-95 transition-all">
            <i data-lucide="message-circle" class="w-4 h-4"></i> Contactar a Soporte
          </a>
          <button onclick="closeCustomModal()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold rounded-xl py-3 text-xs transition">
            Volver
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- ========================================== -->
  <!-- CONTROLADORES LÓGICOS (JavaScript) -->
  <!-- ========================================== -->
  <script>
    // Inicializar iconos lucide
    lucide.createIcons();

    // 1. Simular Splash Screen Inicial (2.5 segundos)
    setTimeout(() => {
      switchScreen('screen-splash', 'screen-login');
    }, 2500);

    // 2. Manejo de Inicio de Sesión
    function handleLogin() {
      const userVal = document.getElementById('input-username').value;
      const passVal = document.getElementById('input-password').value;
      const errorMsg = document.getElementById('login-error');

      if (userVal === 'ecsarvall' && passVal === 'Instagram121026') {
        errorMsg.classList.add('hidden');
        
        switchScreen('screen-login', 'screen-loading-transition');
        
        setTimeout(() => {
          switchScreen('screen-loading-transition', 'screen-profile');
          lucide.createIcons();
        }, 1500);

      } else {
        errorMsg.classList.remove('hidden');
      }
    }

    function switchScreen(fromId, toId) {
      const fromScreen = document.getElementById(fromId);
      const toScreen = document.getElementById(toId);

      fromScreen.classList.add('screen-hidden');
      toScreen.classList.remove('screen-hidden');
    }

    // ==========================================
    // SISTEMA DE MODALES INTEGRADOS
    // ==========================================
    const modal = document.getElementById('custom-modal');
    const modalCard = document.getElementById('modal-card');
    const modalTitle = document.getElementById('modal-title');
    const modalText = document.getElementById('modal-text');
    const btnWhatsapp = document.getElementById('btn-whatsapp');

    function openCustomModal(title, text) {
      modalTitle.innerHTML = `<i data-lucide="info" class="w-5 h-5 text-indigo-400"></i> ${title}`;
      modalText.innerText = text;
      
      const whatsappBaseUrl = "https://wa.me/17744035914"; // Reemplázalo con tu número cuando lo necesites
     
      modal.classList.remove('hidden');
      lucide.createIcons();
      
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modalCard.classList.remove('translate-y-full');
      }, 50);
    }

    function closeCustomModal() {
      modal.classList.add('opacity-0');
      modalCard.classList.add('translate-y-full');
      
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 300);
    }
  </script>
</body>
</html>
